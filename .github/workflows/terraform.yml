name: Terraform platform

on:
  pull_request:
    paths:
      - "terraform/platform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/platform/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

concurrency:
  group: terraform-platform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}

jobs:
  plan:
    # Fork PRs have no repository secrets; never run untrusted Terraform with AWS access.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: terraform/platform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.7"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_TF_PLAN_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_TF_PLAN_SECRET_ACCESS_KEY }}
      - run: terraform init -reconfigure -input=false -backend-config="bucket=$TF_STATE_BUCKET"
      - run: terraform plan -input=false -no-color -lock-timeout=5m

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: terraform-apply
    permissions:
      contents: read
    defaults:
      run:
        working-directory: terraform/platform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.7"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_TF_APPLY_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_TF_APPLY_SECRET_ACCESS_KEY }}
      - run: terraform init -reconfigure -input=false -backend-config="bucket=$TF_STATE_BUCKET"
      - run: terraform plan -input=false -no-color -lock-timeout=5m -out=plan.tfplan
      - run: terraform apply -input=false -no-color plan.tfplan
