name: Terraform platform

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: terraform-platform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
  TF_VAR_eks_api_allowed_cidrs: ${{ secrets.EKS_API_ALLOWED_CIDRS }}
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: terraform/platform
    steps:
      - name: Reject fork PRs before loading credentials
        working-directory: ${{ github.workspace }}
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: test "$HEAD_REPOSITORY" = "$BASE_REPOSITORY"
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_TF_PLAN_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_TF_PLAN_SECRET_ACCESS_KEY }}
      - run: terraform init -reconfigure -input=false -backend-config="bucket=$TF_STATE_BUCKET"
      - run: terraform plan -input=false -no-color -lock-timeout=5m -out=plan.tfplan
      - name: Record reviewed plan fingerprint
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 ../../.github/scripts/terraform_plan_review.py record plan.tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: terraform/platform/plan-review.json
          if-no-files-found: error
          retention-days: 7

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: terraform-apply
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: terraform/platform
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Find reviewed PR plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ../../.github/scripts/terraform_plan_review.py fetch
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_TF_APPLY_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_TF_APPLY_SECRET_ACCESS_KEY }}
      - run: terraform init -reconfigure -input=false -backend-config="bucket=$TF_STATE_BUCKET"
      - run: terraform plan -input=false -no-color -lock-timeout=5m -out=plan.tfplan
      - name: Compare with reviewed PR plan
        run: python3 ../../.github/scripts/terraform_plan_review.py verify plan.tfplan
      - run: terraform apply -input=false -no-color plan.tfplan
