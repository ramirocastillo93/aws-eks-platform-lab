replicaCount: 1

image:
  repository: docmost/docmost
  tag: "0.96.0"
  pullPolicy: IfNotPresent

# Replace with the ALB URL (or your HTTPS domain) after the Ingress is created.
appUrl: "http://localhost:3000"
runtimeSecretName: docmost-runtime

ingress:
  enabled: true
  # Optional DNS host. Leave empty to use the ALB's assigned DNS name directly.
  host: ""
  # Optional ACM certificate ARN in the selected Region. When set, HTTP redirects to HTTPS.
  certificateArn: ""

service:
  type: ClusterIP
  port: 3000

storage:
  # Temporary lab setting; uploaded files disappear with pod replacement.
  type: emptyDir
  size: 10Gi

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
