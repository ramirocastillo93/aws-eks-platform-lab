replicaCount: 1

image:
  repository: docmost/docmost
  tag: "0.96.0"
  pullPolicy: IfNotPresent

appUrl: "https://docmost-checkr.nakamalabs.io"
runtimeSecretName: docmost-runtime

ingress:
  enabled: true
  host: "docmost-checkr.nakamalabs.io"
  # Optional ACM certificate ARN override. When empty, the controller discovers
  # an issued certificate matching ingress.host in the selected Region.
  certificateArn: ""

service:
  type: ClusterIP
  port: 3000

storage:
  # Temporary lab setting; uploaded files disappear with pod replacement.
  type: emptyDir
  size: 10Gi

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
