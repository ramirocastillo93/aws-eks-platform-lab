{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "docmost.fullname" . }}
  labels:
    {{- include "docmost.labels" . | nindent 4 }}
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/auth-type: cognito
    alb.ingress.kubernetes.io/auth-on-unauthenticated-request: authenticate
    alb.ingress.kubernetes.io/auth-scope: {{ .Values.ingress.cognito.scopes | quote }}
    alb.ingress.kubernetes.io/auth-idp-cognito: {{ dict "userPoolARN" (required "ingress.cognito.userPoolArn must be set in deploy/docmost/values.local.yaml" .Values.ingress.cognito.userPoolArn) "userPoolClientID" (required "ingress.cognito.userPoolClientId must be set in deploy/docmost/values.local.yaml" .Values.ingress.cognito.userPoolClientId) "userPoolDomain" (required "ingress.cognito.userPoolDomain must be set in deploy/docmost/values.local.yaml" .Values.ingress.cognito.userPoolDomain) | toJson | quote }}
    {{- if .Values.ingress.certificateArn }}
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.certificateArn | quote }}
    {{- end }}
spec:
  ingressClassName: alb
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "docmost.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
